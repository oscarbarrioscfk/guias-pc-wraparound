name: Deploy to GitHub Pages

on:
  push:
    branches: [main, experimento/visor-doble]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (piloto principal, sirve en /)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout experimento/visor-doble (sirve en /preview/visor-doble/)
        uses: actions/checkout@v4
        with:
          ref: experimento/visor-doble
          path: experimento-visor-doble

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Build experimento/visor-doble
        working-directory: experimento-visor-doble
        env:
          ASTRO_BASE: /guias-pc-wraparound/preview/
        run: |
          npm ci
          npm run build

      - name: Combinar ambos sitios en un solo artefacto
        run: |
          mkdir -p combined
          cp -r main/dist/. combined/
          mkdir -p combined/preview
          cp -r experimento-visor-doble/dist/. combined/preview/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
